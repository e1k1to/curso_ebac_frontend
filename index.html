<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício BootStrap</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1> Formulário de cadastro </h1>
                <form>
                    <label class="form-label" for="nome">Nome</label>
                    <input class="form-control" type="text" id="nome" required>
                    <label class="form-label" for="email">E-Mail</label>
                    <input class="form-control" type="email" required id="email">
                    <label class="form-label" for="telefone">Telefone</label>
                    <input class="form-control" type="tel" id="telefone">
                    <button class="btn btn-success" type="submit">Realizar cadastro</button>
                </form>
            </div>
        </div> 
    </div>
</body>
</html>
